name: Install verified historical split package
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'scripts/build-historical-browser-bundle.py'
      - '.github/workflows/install-historical-split.yml'
permissions:
  contents: read
jobs:
  install:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'build/production-split-517'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate and install reproducible production assets
        run: |
          python scripts/build-historical-browser-bundle.py --split --install
          python scripts/build-historical-browser-bundle.py --split --install --check
          git diff --stat
          git grep -l historical_engine_browser_bundle.js -- '*.html' || true
          for path in games/arduous/native-preview/index.html games/leningrad/native-preview/index.html games/kiev/setup-preview/index.html games/kiev-odessa/experimental-preview/index.html; do
            grep -q historical_engine_entry.js "$path"
            ! grep -q historical_engine_browser_bundle.js "$path"
          done
          python scripts/build-static-release.py "${RUNNER_TEMP}/candidate"
          python scripts/build-static-release.py "${RUNNER_TEMP}/candidate" --verify --http
      - name: Commit only generated files to the dedicated migration branch
        run: |
          git add core/historical_engine_runtime.js core/historical_engine_entry.js core/historical_engine_chunk_*.js core/historical_engine_scripts.json
          git diff --name-only -z -- '*.html' | xargs -0 -r git add --
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: install generated historical split package in production routes"
          git push origin HEAD:refs/heads/build/production-split-517
