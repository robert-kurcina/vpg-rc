name: Mission browser acceptance

# Opt-in release evidence. No new game engine or testing framework.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/mission-hosted-v693.py'
      - '.github/workflows/mission-browser-acceptance.yml'
      - 'core/**'
      - 'games/**'
      - 'index.html'

permissions:
  contents: read

jobs:
  mission-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing Playwright test dependency and Chromium
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Launch real static HTTP origin
        run: |
          python serve.py > "${RUNNER_TEMP}/mission-server.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/mission-server.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8765/index.html; then exit 0; fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/mission-server.log"
          exit 1
      - name: Exercise five routes and real IndexedDB save / resume
        run: |
          mkdir -p browser-evidence
          python tests/mission-hosted-v693.py --url http://127.0.0.1:8765/index.html --evidence-dir browser-evidence
      - name: Preserve actual browser evidence and server diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-browser-evidence
          path: |
            browser-evidence/
            ${{ runner.temp }}/mission-server.log
          if-no-files-found: warn
          retention-days: 14
