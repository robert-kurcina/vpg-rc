name: Mission browser acceptance

# Opt-in release evidence. No new game engine or testing framework.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/mission-hosted-v693.py'
      - 'tests/historical-operational-qualification-v644.test.js'
      - 'scripts/summarize-campaign-profile.js'
      - 'tests/fixtures/terminal-v694/**'
      - 'scripts/run-native-campaign.js'
      - 'scripts/build-static-release.py'
      - 'scripts/build-historical-browser-bundle.py'
      - 'scripts/render-terrain-chart-specimens.js'
      - 'tools/terrain-effects-chart/**'
      - 'tests/b4m-source-combat-v586.test.js'
      - 'tests/b4m-source-movement-v585.test.js'
      - 'tests/historical-housekeeping-eight-turn-v389.test.js'
      - 'tests/shared-terrain-reference-v676.test.js'
      - 'maps/**'
      - 'references/rules/**'
      - 'scripts/build-rulebook-html.py'
      - 'tests/rulebook-cases-v696.py'
      - 'tests/rulebook-navigation-v693.py'
      - '.github/workflows/mission-browser-acceptance.yml'
      - 'core/**'
      - 'games/**'
      - 'index.html'

permissions:
  contents: read

jobs:
  focused-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify existing approved rules and terrain references
        run: |
          node tests/single-pass-movement-binding-v664.test.js
          node tests/b4m-source-combat-v586.test.js
          node tests/b4m-source-movement-v585.test.js
          node tests/historical-housekeeping-eight-turn-v389.test.js
          node tests/shared-terrain-reference-v676.test.js
          node tests/b4m-double-stack-foundation-v684.test.js
          node tests/graduated-mode-v689.test.js
          node tests/ai-difficulty-v668.test.js
          node tests/player-save-config-v654.test.js
          node tests/advanced-crt-v557.test.js
  source-references:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify existing rulebook anchors and reproducible reading editions
        run: |
          python -m pip install 'PyMuPDF>=1.26,<1.27'
          python tests/rulebook-navigation-v693.py
          python tests/rulebook-cases-v696.py
          git diff --exit-code -- references/rules
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Render fortification from the shared engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y inkscape
          node scripts/render-terrain-chart-specimens.js fortification
          test -s assets/terrain-chart/battle-for-moscow/fortification.png
      - uses: actions/upload-artifact@v6
        with:
          name: fortification-engine-specimen
          path: assets/terrain-chart/battle-for-moscow/fortification.png
          if-no-files-found: error
  static-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate and exercise split historical engine
        run: |
          python scripts/build-historical-browser-bundle.py --install --check
      - name: Stage and verify private repository-relative release
        run: |
          python scripts/build-static-release.py "${RUNNER_TEMP}/campaign-release"
          python scripts/build-static-release.py "${RUNNER_TEMP}/campaign-release" --verify --http
  live-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scenario: [arduous, leningrad, kiev, kiev-odessa]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install existing browser dependency
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Generate and exercise split historical engine
        run: |
          python scripts/build-historical-browser-bundle.py --install --check
      - name: Play fresh campaign through automatic browser controller
        run: |
          python serve.py > "${RUNNER_TEMP}/live-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8765/index.html; then break; fi
            sleep 1
          done
          python tests/mission-hosted-v693.py --live-scenario '${{ matrix.scenario }}' --evidence-dir browser-evidence
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: live-campaign-${{ matrix.scenario }}
          path: |
            browser-evidence/
            ${{ runner.temp }}/live-server.log
          if-no-files-found: warn
          retention-days: 14
  campaign-cpu-profile:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'perf/profile-release-525' || github.head_ref == 'perf/reprofile-527'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check out pinned pre-optimization baseline
        if: github.head_ref == 'perf/reprofile-527'
        uses: actions/checkout@v5
        with:
          ref: ae9da3de63100b3a1b91140e90593740e73610b1
          path: pre-optimization
      - name: Compare pre-optimization campaign on this runner
        if: github.head_ref == 'perf/reprofile-527'
        run: |
          mkdir -p performance-evidence
          cd pre-optimization
          BROWSER_PARITY=1 VICTORY_MODE=historical AUDIT_PATH=../performance-evidence/pre-optimization.json FINAL_SAVE_PATH=../performance-evidence/pre-optimization-save.json node tests/historical-operational-qualification-v644.test.js kiev standard 7 5000 campaign baseline greedy same 3 3
      - name: Compare unprofiled and sampled operational campaigns
        run: |
          mkdir -p performance-evidence
          export BROWSER_PARITY=1 VICTORY_MODE=historical
          AUDIT_PATH=performance-evidence/baseline.json FINAL_SAVE_PATH=performance-evidence/baseline-save.json node tests/historical-operational-qualification-v644.test.js kiev standard 7 5000 campaign baseline greedy same 3 3
          CPU_PROFILE_PATH=performance-evidence/campaign.cpuprofile AUDIT_PATH=performance-evidence/profiled.json FINAL_SAVE_PATH=performance-evidence/profiled-save.json node tests/historical-operational-qualification-v644.test.js kiev standard 7 5000 campaign baseline greedy same 3 3
          node scripts/summarize-campaign-profile.js performance-evidence/campaign.cpuprofile performance-evidence/baseline.json performance-evidence/profiled.json performance-evidence/baseline-save.json performance-evidence/profiled-save.json | tee performance-evidence/summary.json
      - name: Verify exact before/after and report same-run speedup
        if: github.head_ref == 'perf/reprofile-527'
        run: |
          node -e 'const fs=require("fs"),a=require("node:assert/strict");const read=n=>JSON.parse(fs.readFileSync("performance-evidence/"+n+".json"));a.deepEqual(read("pre-optimization-save"),read("baseline-save"));const before=read("pre-optimization").computeElapsedMs,after=read("baseline").computeElapsedMs;const report={beforeMs:before,afterMs:after,speedup:before/after,exactCampaign:true};console.log(JSON.stringify(report));fs.writeFileSync("performance-evidence/comparison.json",JSON.stringify(report,null,2))'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: campaign-cpu-profile
          path: performance-evidence/
          if-no-files-found: warn
          retention-days: 14
  operational-parity:
    # Run the representative controlled comparison once for this change,
    # or explicitly via dispatch; avoid repeated expensive qualification.
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'test/operational-parity-521' || github.head_ref == 'perf/reprofile-527'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install existing browser dependency
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Verify committed engine assets
        run: python scripts/build-historical-browser-bundle.py --install --check
      - name: Compare seeded operational Kiev campaign in Node and Chromium
        run: |
          python serve.py > "${RUNNER_TEMP}/operational-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8765/index.html; then break; fi
            sleep 1
          done
          python tests/mission-hosted-v693.py --live-scenario kiev --operational-parity --evidence-dir browser-evidence
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: operational-parity-kiev
          path: |
            browser-evidence/
            ${{ runner.temp }}/operational-server.log
          if-no-files-found: warn
          retention-days: 14
  mission-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install existing Playwright test dependency and Chromium
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Complete one Moscow campaign using the existing native runner
        run: SAVE_PATH="${RUNNER_TEMP}/moscow-terminal.json" node scripts/run-native-campaign.js standard 7 5000 3 3
      - name: Generate and exercise split historical engine
        run: |
          python scripts/build-historical-browser-bundle.py --install --check
      - name: Verify no live HTML references retired monolith
        run: |
          if git grep -n historical_engine_browser_bundle.js -- '*.html'; then exit 1; fi
      - name: Launch real static HTTP origin
        run: |
          python scripts/build-static-release.py "${RUNNER_TEMP}/staged-site/russian-campaign"
          python scripts/build-static-release.py "${RUNNER_TEMP}/staged-site/russian-campaign" --verify
          python -m http.server 8765 --bind 127.0.0.1 --directory "${RUNNER_TEMP}/staged-site" > "${RUNNER_TEMP}/mission-server.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/mission-server.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8765/russian-campaign/index.html; then exit 0; fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/mission-server.log"
          exit 1
      - name: Exercise five routes and real IndexedDB save / resume
        run: |
          mkdir -p browser-evidence
          python tests/mission-hosted-v693.py --url http://127.0.0.1:8765/russian-campaign/index.html --evidence-dir browser-evidence --terminal-save "${RUNNER_TEMP}/moscow-terminal.json"
      - name: Preserve generated split package
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: split-historical-engine
          path: |
            core/historical_engine_runtime.js
            core/historical_engine_entry.js
            core/historical_engine_chunk_*.js
            core/historical_engine_scripts.json
          if-no-files-found: error
      - name: Preserve actual browser evidence and server diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mission-browser-evidence
          path: |
            browser-evidence/
            ${{ runner.temp }}/mission-server.log
          if-no-files-found: warn
          retention-days: 14
